apiVersion: v1
kind: Service
metadata:
  name: web-service
  labels:
    app: java-app-service
spec:
  type: ClusterIP
  selector:
    app: java-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deployment
  labels:
    app: java-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
        - name: java-app
          image: abhishekujale799/java-hello:latest
          ports:
            - containerPort: 8080

